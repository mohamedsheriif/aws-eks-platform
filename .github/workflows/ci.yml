name: CI

# Check formatting, lint the modules, then plan every environment and scan the plans with
# Trivy. Runs on main too, so Security > Code scanning tracks the default branch.
on:
  pull_request:
    paths:
      - live/**
      - modules/**
      - scripts/scan-plans.sh
      - .tflint.hcl
      - .github/**
  push:
    branches: [main]
    paths:
      - live/**
      - modules/**
      - scripts/scan-plans.sh

# A new push to the same pull request or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.13.3
  TERRAGRUNT_VERSION: 0.90.0
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_NO_COLOR: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}
          cache: "false"

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff modules

      - name: Terragrunt hcl fmt
        working-directory: live
        run: terragrunt hcl fmt --check --diff

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caches the plugins declared in .tflint.hcl.
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
          cache: true

      - name: Install plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint
        run: tflint --recursive --chdir modules --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  plan:
    name: Plan (${{ matrix.environment }})
    needs: [fmt, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
      security-events: write # upload Trivy results to code scanning
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    env:
      # Until the AWS account exists (repository variable AWS_DEPLOY_ENABLED != "true"),
      # plans run in mock mode: local state, fake credentials, mocked dependency outputs.
      TG_MOCK: ${{ vars.AWS_DEPLOY_ENABLED == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Read env.hcl
        id: env
        run: |
          read_env() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]*)\".*/\1/p" "live/${{ matrix.environment }}/env.hcl" | head -n 1
          }
          {
            echo "project=$(read_env project)"
            echo "region=$(read_env region)"
            echo "account_id=$(read_env account_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: env.TG_MOCK == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.account_id }}:role/${{ steps.env.outputs.project }}-${{ matrix.environment }}-github-plan
          aws-region: ${{ steps.env.outputs.region }}
          allowed-account-ids: ${{ steps.env.outputs.account_id }}

      - name: Terragrunt plan
        working-directory: live/${{ matrix.environment }}
        run: |
          # The EKS API is private, so in-cluster units are only planned in mock mode.
          queue_args=()
          if [[ "$TG_MOCK" == "false" ]]; then
            queue_args+=(--queue-exclude-dir 'helm-*')
          fi
          terragrunt run --all plan "${queue_args[@]}" --json-out-dir "$RUNNER_TEMP/plans" -- -no-color 2>&1 \
            | tee "$RUNNER_TEMP/plan.log"

      - name: Summarize plan
        if: always()
        run: |
          mode=$([[ "$TG_MOCK" == "true" ]] && echo "mock" || echo "AWS")
          {
            echo "### Plan: ${{ matrix.environment }} (${mode})"
            echo
            echo "| Unit | Result |"
            echo "|---|---|"
            sed -nE 's/.*\[([^]]+)\] terraform: (Plan: .*|No changes\..*)/| \1 | \2 |/p' "$RUNNER_TEMP/plan.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true

      # Trivy downloads its checks bundle on each run unless it is cached. The key changes
      # every run so the newest bundle is saved; restore-keys picks up the latest one.
      - name: Cache Trivy checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-checks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-checks-${{ runner.os }}-

      - name: Scan plans
        run: ./scripts/scan-plans.sh "${{ matrix.environment }}" "$RUNNER_TEMP/plans" "$RUNNER_TEMP/trivy.sarif"

      # One row per finding, highest severity first, linked to the check docs and the unit.
      - name: Summarize findings
        run: |
          {
            echo "### Trivy findings: ${{ matrix.environment }}"
            echo
            echo "| Severity | Check | Finding | Unit |"
            echo "|---|---|---|---|"
            jq -r --arg blob "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" '
              (.runs[0].tool.driver.rules | map({ (.id): .properties.tags[-1] }) | add // {}) as $severity
              | [ .runs[0].results[]
                  | {
                      severity: $severity[.ruleId],
                      check: .ruleId,
                      message: (.message.text | capture("Message: (?<m>[^\n]*)").m),
                      file: .locations[0].physicalLocation.artifactLocation.uri
                    } ]
              | unique
              | sort_by((.severity as $s | ["CRITICAL", "HIGH", "MEDIUM", "LOW"] | index($s)), .file)
              | .[]
              | "| \(.severity) | [\(.check)](https://avd.aquasec.com/misconfig/\(.check | ascii_downcase)) | \(.message) | [\(.file | split("/")[2])](\($blob)/\(.file)) |"
            ' "$RUNNER_TEMP/trivy.sarif"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
