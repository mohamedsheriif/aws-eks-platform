name: Security

# Scans every unit for AWS misconfigurations with Trivy and publishes the results to the
# repository's Security > Code scanning tab. Runs on main too, so the tab tracks the
# default branch. Findings are reported, not blocking.
on:
  pull_request:
    paths:
      - live/**
      - modules/**
      - scripts/security-scan.sh
      - .github/**
  push:
    branches: [main]
    paths:
      - live/**
      - modules/**
      - scripts/security-scan.sh
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.13.3
  TERRAGRUNT_VERSION: 0.90.0
  TRIVY_VERSION: v0.76.1
  TG_NON_INTERACTIVE: "true"
  TG_NO_COLOR: "true"

jobs:
  trivy:
    name: Trivy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only terragrunt render is used, which needs no providers.
      - uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}
          cache: "false"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      # Trivy downloads its checks bundle on each run unless it is cached. The key changes
      # every run so the newest bundle is saved; restore-keys picks up the latest one.
      - name: Cache Trivy checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-checks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-checks-${{ runner.os }}-

      - name: Scan
        run: ./scripts/security-scan.sh "${{ matrix.environment }}" "$RUNNER_TEMP/trivy.sarif"

      # One row per finding, highest severity first, linked to the check docs and the code.
      - name: Summarize findings
        run: |
          {
            echo "### Trivy findings: ${{ matrix.environment }}"
            echo
            echo "| Severity | Check | Finding | Location |"
            echo "|---|---|---|---|"
            jq -r --arg blob "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" '
              (.runs[0].tool.driver.rules | map({ (.id): .properties.tags[-1] }) | add // {}) as $severity
              | [ .runs[0].results[]
                  | .locations[0].physicalLocation as $loc
                  | {
                      severity: $severity[.ruleId],
                      check: .ruleId,
                      message: (.message.text | capture("Message: (?<m>[^\n]*)").m),
                      file: $loc.artifactLocation.uri,
                      line: $loc.region.startLine
                    } ]
              | unique
              | sort_by((.severity as $s | ["CRITICAL", "HIGH", "MEDIUM", "LOW"] | index($s)), .file, .line)
              | .[]
              | "| \(.severity) | [\(.check)](https://avd.aquasec.com/misconfig/\(.check | ascii_downcase)) | \(.message) | [\(.file):\(.line)](\($blob)/\(.file)#L\(.line)) |"
            ' "$RUNNER_TEMP/trivy.sarif"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
