# Created here rather than in helm-platform so the Secret exists before Grafana starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: ${secret_name}
        property: username
    - secretKey: admin-password
      remoteRef:
        key: ${secret_name}
        property: password
