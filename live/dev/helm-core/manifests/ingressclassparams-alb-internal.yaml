# One shared internal ALB for platform UIs (Argo CD, Grafana), reachable over the tailnet.
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: alb-internal
spec:
  scheme: internal
  targetType: ip
  group:
    name: ${group}
  certificateArn:
    - ${certificate_arn}
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  sslRedirectPort: "443"
  loadBalancerAttributes:
    - key: routing.http.drop_invalid_header_fields.enabled
      value: "true"
