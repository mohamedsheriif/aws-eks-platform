installCRDs: true

# Must match the Pod Identity association in the eks unit.
serviceAccount:
  name: external-secrets

global:
  nodeSelector:
    role: system

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 5m
      memory: 24Mi
    limits:
      memory: 64Mi

certController:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 96Mi
