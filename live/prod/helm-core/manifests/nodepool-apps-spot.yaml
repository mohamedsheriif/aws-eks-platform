# Spot capacity for application pods, on top of the on-demand apps node group. Nodes carry
# the same role=apps label, so workloads land on either without changes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps-spot
spec:
  template:
    metadata:
      labels:
        role: apps
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        # Many instance families and sizes give Spot more pools to choose from.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      # Nodes are replaced every 30 days to pick up new AMIs.
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: "32"
    memory: 128Gi
