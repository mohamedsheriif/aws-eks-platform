provider:
  name: aws

# Pods can't reach IMDS (hop limit 1), so the region is set explicitly.
env:
  - name: AWS_DEFAULT_REGION
    value: ${region}

# Must match the Pod Identity association in the eks unit.
serviceAccount:
  name: external-dns

sources:
  - ingress

# Only manage records in this environment's zone, and only records this cluster owns.
domainFilters:
  - ${domain}
extraArgs:
  - --zone-id-filter=${zone_id}
  - --aws-zone-type=public
policy: sync
registry: txt
txtOwnerId: ${owner_id}

nodeSelector:
  role: system

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    memory: 64Mi

serviceMonitor:
  enabled: true
