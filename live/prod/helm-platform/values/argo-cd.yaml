global:
  domain: argocd.${domain}
  nodeSelector:
    role: system

# TLS ends at the ALB. The CLI connects with --grpc-web.
configs:
  params:
    server.insecure: true

# No SSO or notifications in dev; log in with the generated admin password.
dex:
  enabled: false
notifications:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: alb-internal
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 384Mi

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 48Mi
