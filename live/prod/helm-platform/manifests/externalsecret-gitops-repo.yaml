# Argo CD picks up any Secret labelled secret-type=repository as credentials for that URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: gitops-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: ${repo_url}
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${secret_name}
